<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bon de Dotation — Domofrance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:12px;color:#222;background:#f0f0f0;padding:24px}
.page{background:#fff;max-width:800px;margin:0 auto;padding:28px 36px;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.no-print{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #eee;display:flex;gap:8px}
.btn{padding:8px 18px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.btn-print{background:#1a2e4a;color:#fff}
.btn-print:hover{background:#2a4f7a}
.btn-close{background:#eee;color:#333}
.btn-close:hover{background:#ddd}
.header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:3px solid #e8003d;margin-bottom:20px}
.header img{height:56px}
.header-right{text-align:right}
.header-right .bon-title{font-size:18px;font-weight:700;color:#1a2e4a}
.header-right .bon-ref{font-size:10px;color:#888;margin-top:3px}
.header-right .bon-sub{font-size:10px;color:#888;margin-top:2px}
.info-block{background:#f6f8fa;border:1px solid #e0e4ea;border-radius:5px;padding:12px 16px;margin-bottom:18px}
.info-block .block-title{font-size:9px;font-weight:700;color:#1a2e4a;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.info-cell .lbl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.04em}
.info-cell .val{font-size:12px;font-weight:600;color:#222;margin-top:1px}
.section-title{font-size:10px;font-weight:700;color:#1a2e4a;text-transform:uppercase;letter-spacing:.06em;padding-bottom:5px;border-bottom:2px solid #e8003d;margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px}
thead tr{background:#1a2e4a}
thead th{color:#fff;padding:6px 10px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
tbody tr:nth-child(even){background:#f8f9fb}
tbody td{padding:6px 10px;border-bottom:1px solid #eee}
.note-box{border-left:3px solid #c05621;background:#fff8f0;padding:7px 12px;font-size:10px;color:#444;border-radius:2px;margin-top:6px;line-height:1.6}
.note-box.blue{border-color:#1a2e4a;background:#eef2ff}
.sig-zone{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.sig-box{border:1px solid #ccc;border-radius:4px;padding:10px 14px;min-height:90px}
.sig-box .sig-lbl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.sig-box .sig-name{font-size:12px;font-weight:700;color:#1a2e4a}
.sig-line{height:50px;border-top:1px solid #ddd;margin-top:8px}
footer{margin-top:20px;padding-top:10px;border-top:1px solid #eee;font-size:9px;color:#bbb;text-align:center}
.empty-msg{color:#888;text-align:center;padding:20px;font-style:italic}
@media print{
  body{background:#fff;padding:0}
  .page{box-shadow:none;border-radius:0;padding:16px 24px;max-width:100%}
  .no-print{display:none!important}
  @page{margin:12mm}
}
</style>
</head>
<body>
<div class="page">
  <div class="no-print">
    <button class="btn btn-print" onclick="window.print()">🖨 Imprimer / Exporter PDF</button>
    <button class="btn btn-close" onclick="window.close()">✕ Fermer</button>
    <span id="status" style="font-size:11px;color:#888;margin-left:8px;align-self:center"></span>
  </div>
  <div id="bon-content">
    <div class="empty-msg">Chargement des données...</div>
  </div>
</div>

window.addEventListener('load', function(){
  // Lire les données depuis localStorage
  var raw = localStorage.getItem('domo_bon_data');
  if(!raw){
    document.getElementById('bon-content').innerHTML = '<div class="empty-msg">⚠ Aucune donnée de bon trouvée.<br>Retournez sur l'outil EPI et cliquez sur "Générer le bon".</div>';
    document.getElementById('status').textContent = 'Aucune donnée';
    return;
  }

  var d;
  try{ d = JSON.parse(raw); } catch(e){
    document.getElementById('bon-content').innerHTML = '<div class="empty-msg">Erreur de lecture des données.</div>';
    return;
  }

  // Nettoyer les données après lecture
  localStorage.removeItem('domo_bon_data');

  renderBon(d);
  document.getElementById('status').textContent = 'Données chargées — ' + d.nom + ' ' + d.prenom;
  document.title = 'Bon de Dotation — ' + d.nom + ' ' + d.prenom;
});

function renderBon(d){
  var typeLabel = {dotation:'DOTATION', restitution:'RESTITUTION', remplacement:'REMPLACEMENT'};
  var typeLabelBadge = {acces:'Accès', watchdoc:'WatchDoc', alarme:'Alarme', autre:'Autre'};

  var epiRows = (d.epiLines||[]).map(function(l){
    return '<tr><td>'+l.ref+'</td><td>'+(l.designation||'—')+'</td><td style="text-align:center">'+(l.taille||'—')+'</td><td style="text-align:center">'+l.qte+'</td></tr>';
  }).join('');

  var telRows = (d.telLines||[]).map(function(l){
    return '<tr><td>'+l.marque+' '+l.modele+'</td><td>'+l.imei+'</td><td>'+(l.pin||'—')+'</td><td>'+(l.deverouillage||'—')+'</td><td>'+(l.puk||'—')+'</td></tr>';
  }).join('');

  var tabRows = (d.tabLines||[]).map(function(l){
    return '<tr><td>'+l.marque+' '+l.modele+'</td><td>'+l.imei+'</td><td>'+(l.pin||'—')+'</td><td>'+(l.deverouillage||'—')+'</td><td>'+(l.puk||'—')+'</td></tr>';
  }).join('');

  var badgeRows = (d.badgeLines||[]).map(function(l){
    return '<tr><td><strong>'+l.numero+'</strong></td><td>'+(typeLabelBadge[l.type_badge]||l.type_badge||'—')+'</td><td>'+(l.notes||'—')+'</td><td style="font-family:monospace">'+(l.puk_watchdoc||'—')+'</td></tr>';
  }).join('');

  var html = '';

  // En-tête
  html += '<div class="header">';
  html += '<img src="data:image/png;base64,'+LOGO+'" alt="Domofrance">';
  html += '<div class="header-right">';
  html += '<div class="bon-title">BON DE '+(typeLabel[d.type]||d.type||'DOTATION').toUpperCase()+'</div>';
  html += '<div class="bon-ref">Réf. '+d.ref+' &nbsp;·&nbsp; '+d.dateStr+'</div>';
  html += '<div class="bon-sub">Pôle Facilities — Domofrance</div>';
  html += '</div></div>';

  // Infos collaborateur
  html += '<div class="info-block"><div class="block-title">Informations collaborateur</div>';
  html += '<div class="info-grid">';
  html += '<div class="info-cell"><div class="lbl">Nom / Prénom</div><div class="val">'+d.nom.toUpperCase()+' '+d.prenom+'</div></div>';
  html += '<div class="info-cell"><div class="lbl">Identifiant</div><div class="val">'+(d.matricule||'—')+'</div></div>';
  html += '<div class="info-cell"><div class="lbl">Site / Agence</div><div class="val">'+(d.site||'—')+'</div></div>';
  html += d.motif ? '<div class="info-cell"><div class="lbl">Motif</div><div class="val">'+d.motif+'</div></div>' : '<div></div>';
  html += '</div></div>';

  // EPI
  if(epiRows){
    html += '<div class="section-title">🦺 EPI attribués</div>';
    html += '<table><thead><tr><th>Référence</th><th>Désignation</th><th>Taille</th><th>Qté</th></tr></thead><tbody>'+epiRows+'</tbody></table>';
    html += '<div class="note-box"><strong>Attestation :</strong> J'atteste avoir été informé des principes généraux relatifs à l'utilisation des EPI et je m'engage à les porter chaque fois que la situation de travail le nécessite.</div>';
  }

  // Téléphones
  if(telRows){
    html += '<div class="section-title">📱 Téléphones attribués</div>';
    html += '<table><thead><tr><th>Marque / Modèle</th><th>IMEI</th><th>Code PIN</th><th>Code déverrouillage</th><th>Code PUK</th></tr></thead><tbody>'+telRows+'</tbody></table>';
    html += '<div class="note-box blue"><strong>Appareil enrôlé dans Samsung Knox MDM</strong> — Utilisation professionnelle uniquement.</div>';
  }

  // Tablettes
  if(tabRows){
    html += '<div class="section-title">📟 Tablettes attribuées</div>';
    html += '<table><thead><tr><th>Marque / Modèle</th><th>IMEI</th><th>Code PIN</th><th>Code déverrouillage</th><th>Code PUK</th></tr></thead><tbody>'+tabRows+'</tbody></table>';
    html += '<div class="note-box blue"><strong>Appareil enrôlé dans Samsung Knox MDM</strong> — Utilisation professionnelle uniquement.</div>';
  }

  // Badges
  if(badgeRows){
    html += '<div class="section-title">🪪 Badges attribués</div>';
    html += '<table><thead><tr><th>N° Badge</th><th>Type</th><th>Notes</th><th>Code PUK Siège (WatchDoc)</th></tr></thead><tbody>'+badgeRows+'</tbody></table>';
  }

  if(!epiRows && !telRows && !tabRows && !badgeRows){
    html += '<div class="empty-msg">Aucun équipement renseigné</div>';
  }

  // Signatures
  html += '<div class="sig-zone">';
  html += '<div class="sig-box"><div class="sig-lbl">Remis par — Pôle Facilities</div><div class="sig-line"></div></div>';
  html += '<div class="sig-box"><div class="sig-lbl">Reçu par le collaborateur</div><div class="sig-name">'+d.nom.toUpperCase()+' '+d.prenom+'</div><div class="sig-line"></div></div>';
  html += '</div>';

  html += '<footer>Document généré le '+new Date().toLocaleDateString("fr-FR")+' — Domofrance Pôle Facilities &nbsp;·&nbsp; Usage interne confidentiel</footer>';

  document.getElementById('bon-content').innerHTML = html;
}
</script>
